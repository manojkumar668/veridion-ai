<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veridion AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ================= CORE ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Inter;
}

body {
    height: 100vh;
    overflow: hidden;
}

.container {
    display: flex;
    height: 100vh;
    width: 100%;
}

/* SIDEBAR IMPROVED */
.sidebar {
    width: 240px;
    background: #f7f7f7;
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap:12px;
}

/* IMPROVED BUTTONS */
.sidebar button {
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.sidebar button:hover {
    transform: translateY(-2px);
    background: #000;
    color: #fff;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* THEME */
:root{
    --bg:#fff;
    --text:#000;
    --panel:#f5f5f5;
    --border:#ddd;
}

body.dark{
    --bg:#0f0f0f;
    --text:#fff;
    --panel:#1a1a1a;
    --border:#333;
}

body{
    background:var(--bg);
    color:var(--text);
}

/* HEADER */
.header{
    padding:12px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:20px;
    font-weight:800;
    text-align:center;
    flex:1;
}

/* CHAT */
.chat{
    flex:1;
    padding:15px;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    max-width:75%;
    padding:12px;
    border-radius:10px;
    white-space:pre-line;
    font-size:13px;
}

.user{background:#000;color:#fff;align-self:flex-end;}
.bot{background:var(--panel);border:1px solid var(--border);align-self:flex-start;}

/* INPUT */
.inputBar{
    display:flex;
    gap:6px;
    padding:10px;
    border-top:1px solid var(--border);
}

input{
    flex:1;
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
}

/* SEND BUTTON IMPROVED */
.sendBtn{
    width:50px;
    border:none;
    background:#000;
    color:#fff;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}

.sendBtn:hover{
    transform:scale(1.1);
}

/* POPUP */
.popup{
    position:absolute;
    bottom:70px;
    left:10px;
    width:220px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    display:none;
    flex-direction:column;
    gap:10px;
}

/* VOICE BUTTON FIXED */
.voiceBtn{
    padding:8px;
    border:1px solid var(--border);
    background:transparent;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}

.voiceBtn:hover{
    background:#000;
    color:#fff;
}

.voiceBtn.active{
    background:#000;
    color:#fff;
}

/* PANEL */
.panel{
    position:fixed;
    right:10px;
    top:60px;
    width:340px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    display:none;
}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">
    <button onclick="toggleDash()">📊 Dashboard</button>
    <button onclick="toggleHistory()">🕘 History</button>
    <button onclick="toggleTheme()">🌓 Theme</button>
</div>

<div class="main">

<div class="header">
    <div></div>
    <div class="title">VERIDION AI</div>
    <div id="loginTime"></div>
</div>

<div class="chat" id="chat"></div>

<div class="inputBar">
    <button onclick="togglePopup()">＋</button>
    <input id="input" placeholder="Type message...">
    <button class="sendBtn" onclick="send()">➤</button>
</div>

<div class="popup" id="popup">
    <b>Voice</b>
    <button class="voiceBtn active" onclick="setVoice('male')">Male</button>
    <button class="voiceBtn" onclick="setVoice('female')">Female</button>
</div>

</div>

</div>

<div class="panel" id="history"></div>
<div class="panel" id="dash"><canvas id="chart"></canvas></div>

<script>

let history=[];
let fake=0, real=0;
let voiceType="male";
let chart;

/* FIX: Voice loading */
let voices = [];

function loadVoices(){
    voices = speechSynthesis.getVoices();
}
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

document.getElementById("loginTime").innerText=new Date().toLocaleString();

function addMsg(t,c){
    let d=document.createElement("div");
    d.className="msg "+c;
    d.innerText=t;
    document.getElementById("chat").appendChild(d);
}

/* POPUP */
function togglePopup(){
    let p=document.getElementById("popup");
    p.style.display=(p.style.display==="flex")?"none":"flex";
}

/* FIXED VOICE SELECTION (MALE + FEMALE WORKING) */
function setVoice(type){
    voiceType=type;

    document.querySelectorAll(".voiceBtn").forEach(b=>{
        b.classList.remove("active");
    });

    event.target.classList.add("active");

    document.getElementById("popup").style.display="none";
}

/* 🔥 FIXED SPEECH ENGINE */
function speak(text){

    let u = new SpeechSynthesisUtterance(text);

    let female = voices.find(v =>
        v.name.toLowerCase().includes("female") ||
        v.name.toLowerCase().includes("zira") ||
        v.lang.includes("en-US") && v.name.toLowerCase().includes("google")
    );

    let male = voices.find(v =>
        v.name.toLowerCase().includes("male") ||
        v.name.toLowerCase().includes("david") ||
        v.name.toLowerCase().includes("mark")
    );

    if(voiceType === "female" && female){
        u.voice = female;
        u.pitch = 1.4;
        u.rate = 1;
    }
    else if(voiceType === "male" && male){
        u.voice = male;
        u.pitch = 0.9;
        u.rate = 1;
    }

    speechSynthesis.cancel();
    speechSynthesis.speak(u);
}

/* SEND */
async function send(){

    let input=document.getElementById("input");
    let text=input.value.trim();
    if(!text) return;

    addMsg(text,"user");
    history.push(text);
    updateHistory();

    input.value="";

    let res=await fetch("/predict",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text})
    });

    let data=await res.json();

    if(data.prediction==="FAKE") fake++;
    else real++;

    updateChart();

    let trust = data.prediction==="REAL"
        ? "✔ You can trust this content."
        : "❌ Do NOT trust this content.";

    let output=
`🧠 RESULT: ${data.prediction}

📊 CONFIDENCE: ${data.confidence}

📌 ANALYSIS:
- ${data.reason.join("\n- ")}

FINAL VERDICT:
${trust}`;

    addMsg(output,"bot");
    speak(output);
}

/* HISTORY */
function updateHistory(){
    let h=document.getElementById("history");
    h.innerHTML="<b>History</b><br>";
    history.slice(-10).forEach(t=>{
        h.innerHTML+="<div>"+t+"</div><hr>";
    });
}

/* CHART */
function updateChart(){

    let total=fake+real;
    let rf=total?Math.round((real/total)*100):0;
    let ff=total?Math.round((fake/total)*100):0;

    if(chart) chart.destroy();

    chart=new Chart(document.getElementById("chart"),{
        type:"pie",
        data:{
            labels:[`Real ${rf}%`,`Fake ${ff}%`],
            datasets:[{
                data:[real,fake],
                backgroundColor:["green","red"]
            }]
        }
    });
}

/* PANELS */
function toggleDash(){
    let d=document.getElementById("dash");
    d.style.display=(d.style.display==="block")?"none":"block";
    updateChart();
}

function toggleHistory(){
    let h=document.getElementById("history");
    h.style.display=(h.style.display==="block")?"none":"block";
}

function toggleTheme(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
