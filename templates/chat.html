
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veridion AI - Console Workspace</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #fafaff;
            --card-bg: #ffffff;
            --text-main: #0c111d;
            --text-muted: #667085;
            --accent-blue: #2970ff;
            --accent-success: #12b76a;
            --accent-danger: #f04438;
            --border-ultra-soft: rgba(0, 0, 0, 0.04);
            --input-border: rgba(0, 0, 0, 0.08);
            --chromatic-glow: linear-gradient(90deg, #3a7bd5, #3a6073, #00d2ff, #92fe9d, #00c6ff, #0072ff, #3a7bd5);
            --map-tiles-filter: grayscale(20%) contrast(110%);
        }

        [data-theme="dark"] {
            --bg-canvas: #080b11;
            --card-bg: #0d121f;
            --text-main: #f5f7fa;
            --text-muted: #8090a6;
            --accent-blue: #00d2ff;
            --accent-success: #00f2fe;
            --accent-danger: #ff007f;
            --border-ultra-soft: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
            --chromatic-glow: linear-gradient(90deg, #ff007f, #7928ca, #00d2ff, #12b76a, #00d2ff, #7928ca, #ff007f);
            --map-tiles-filter: invert(100%) hue-rotate(180deg) grayscale(30%) contrast(90%);
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.2s ease;
        }

        body {
            display: flex;
            height: 100vh;
            background: var(--bg-canvas);
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        .viewport-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .top-navbar {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(13, 18, 31, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-ultra-soft);
        }

        .nav-left-cluster, .nav-right-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .brand-signature {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--chromatic-glow);
            background-size: 400% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: chromaticFlow 6s linear infinite;
        }

        .nav-right-cluster button {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-right-cluster button:hover { color: var(--text-main); }

        .voice-selector {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-ultra-soft);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .workspace-scroller {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px;
        }

        .canvas-container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .ambient-greet {
            text-align: center;
            margin-top: 140px;
            animation: paneFadeIn 0.8s forwards;
        }

        .ambient-greet h2 {
            font-size: 34px;
            font-weight: 700;
            background: var(--chromatic-glow);
            background-size: 400% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: chromaticFlow 8s linear infinite;
        }

        .ambient-greet p {
            font-size: 15px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        @keyframes paneFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes chromaticFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .message-row {
            display: flex;
            flex-direction: column;
            animation: paneFadeIn 0.4s forwards;
        }

        .message-row.user { align-items: flex-end; }
        .message-row.bot { align-items: flex-start; }

        .bubble {
            max-width: 85%;
            font-size: 15px;
            line-height: 1.6;
        }

        .user .bubble {
            background: var(--input-border);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 20px 20px 4px 20px;
        }

        .bot .bubble { width: 100%; color: var(--text-main); }

        .gemini-loading-wrapper {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 32px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-ultra-soft);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.05);
            margin-top: 12px;
        }

        .fluid-loader-bar {
            height: 18px;
            width: 100%;
            border-radius: 9px;
            background: var(--chromatic-glow);
            background-size: 300% 300%;
            animation: chromaticFlow 2.5s ease-in-out infinite;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4), 0 4px 12px rgba(0, 210, 255, 0.2);
            opacity: 0.9;
        }

        .fluid-loader-bar.short { width: 65%; animation-delay: 0.2s; }
        .fluid-loader-bar.mini { width: 40%; animation-delay: 0.4s; }

        .audit-card {
            background: var(--card-bg);
            border: 1px solid var(--border-ultra-soft);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
            margin-top: 12px;
            position: relative;
        }

        .card-accent-line {
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 5px;
            border-top-left-radius: 24px;
            border-bottom-left-radius: 24px;
        }

        .passed-accent { background-color: var(--accent-success); }
        .failed-accent { background-color: var(--accent-danger); }

        .audit-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .verdict-tag {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 8px;
        }

        .verdict-tag.passed { background: rgba(18, 183, 106, 0.15); color: var(--accent-success); }
        .verdict-tag.failed { background: rgba(240, 68, 56, 0.15); color: var(--accent-danger); }

        .critique-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .critique-list li {
            font-size: 14.5px;
            color: var(--text-main);
            position: relative;
            padding-left: 22px;
        }

        .critique-list li::before {
            content: '•';
            position: absolute;
            left: 4px;
            color: var(--text-muted);
        }

        .footer-control-rack {
            padding: 20px 24px 40px 24px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to top, var(--bg-canvas) 80%, transparent);
        }

        .input-bar-capsule {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            border-radius: 26px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            border: 1px solid var(--input-border);
        }

        .input-bar-capsule input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            color: var(--text-main);
            background: transparent;
            padding: 10px;
        }

        .action-icon-group button {
            background: none;
            border: none;
            cursor: pointer;
            width: 36px; height: 36px;
            border-radius: 50%;
            color: var(--text-muted);
            font-size: 18px;
        }

        .action-icon-group button:hover { background: rgba(128,128,128,0.1); color: var(--text-main); }
        .icon-submit-action { background: var(--text-main) !important; color: var(--card-bg) !important; }

        .dashboard-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 11, 17, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 24px;
        }

        .dashboard-content {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.3);
            border: 1px solid var(--border-ultra-soft);
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: var(--input-border);
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
        }

        #mapContainer {
            width: 100%;
            height: 600px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-ultra-soft);
        }

        .custom-threat-popup .leaflet-popup-content-wrapper {
            background: var(--card-bg);
            color: var(--text-main);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .custom-threat-popup .leaflet-popup-tip { background: var(--card-bg); }
    </style>
</head>
<body>

    <div class="viewport-wrapper">
        <div class="top-navbar">
            <div class="nav-left-cluster">
                <div class="brand-signature">Veridion AI</div>
            </div>
            <div class="nav-right-cluster">
                <select id="voiceMenu" class="voice-selector" onchange="changeVoice()">
                    <option value="">Loading Voices...</option>
                </select>
                <button onclick="toggleTheme()" id="themeToggleBtn">Theme: Light</button>
                <button onclick="toggleMapModal()" style="color: var(--accent-blue);">Global Threat Feed</button>
            </div>
        </div>

        <div class="workspace-scroller" id="scrollerNode">
            <div class="canvas-container" id="chatCanvas">
                <div class="ambient-greet" id="ambientGreet">
                    <h2>Verify Source Telemetry</h2>
                    <p>Provide a document string pipeline or cross-reference parameter log below.</p>
                </div>
            </div>
        </div>

        <div class="footer-control-rack">
            <div class="input-bar-capsule">
                <input id="text" type="text" placeholder="Pass pipeline input matrix strings..." onkeydown="if(event.key==='Enter')send()">
                <div class="action-icon-group">
                    <button class="icon-submit-action" onclick="send()">➔</button>
                </div>
            </div>
        </div>
    </div>

    <div class="dashboard-overlay" id="mapOverlay">
        <div class="dashboard-content">
            <div class="dash-header">
                <h3>Live Geopolitical Threat Spreading Matrix</h3>
                <button class="close-btn" onclick="toggleMapModal()">Close Feed</button>
            </div>
            <div id="mapContainer"></div>
        </div>
    </div>

    <script>
        let currentVoice = null;
        let availableVoices = [];
        let leafletMapInstance = null;

        function loadVoiceSystem() {
            if (!window.speechSynthesis) return;

            const populateVoices = () => {
                availableVoices = window.speechSynthesis.getVoices();
                const menu = document.getElementById("voiceMenu");
                menu.innerHTML = "";

                if (availableVoices.length === 0) {
                    menu.innerHTML = "<option>No Voices Found</option>";
                    return;
                }

                availableVoices.forEach((v, index) => {
                    let option = document.createElement("option");
                    option.value = index;
                    option.textContent = `${v.name} (${v.lang})`;
                    menu.appendChild(option);
                });

                let defaultVoiceIndex = availableVoices.findIndex(v => 
                    v.lang.startsWith('en') && (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('samantha'))
                );

                if (defaultVoiceIndex !== -1) {
                    menu.selectedIndex = defaultVoiceIndex;
                    currentVoice = availableVoices[defaultVoiceIndex];
                } else {
                    currentVoice = availableVoices[0];
                }
            };

            populateVoices();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = populateVoices;
            }
        }

        function changeVoice() {
            const menu = document.getElementById("voiceMenu");
            currentVoice = availableVoices[menu.value];
        }

        loadVoiceSystem();

        function speak(text) {
            if (!window.speechSynthesis || !currentVoice) return;
            window.speechSynthesis.cancel();
            let sanitized = text.replace(/[📌📊🧠🔐❌¼✅✨➔📄•]/g, '');
            let utterance = new SpeechSynthesisUtterance(sanitized);
            utterance.voice = currentVoice;
            window.speechSynthesis.speak(utterance);
        }

        function toggleTheme() {
            let active = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', active);
            document.getElementById('themeToggleBtn').innerText = active === 'dark' ? "Theme: Light" : "Theme: Dark";
            if (leafletMapInstance) setTimeout(renderThreatMatrixMap, 100);
        }

        function appendMessageElement(text, type) {
            let greetNode = document.getElementById("ambientGreet");
            if (greetNode) greetNode.style.display = "none";
            let row = document.createElement("div");
            row.className = "message-row " + type;
            let bubble = document.createElement("div");
            bubble.className = "bubble";
            if (type === "bot") bubble.innerHTML = text;
            else bubble.innerText = text;

            row.appendChild(bubble);
            document.getElementById("chatCanvas").appendChild(row);
            let scroller = document.getElementById("scrollerNode");
            scroller.scrollTop = scroller.scrollHeight;
            return bubble;
        }

        function send() {
            let inputField = document.getElementById("text");
            let text = inputField.value.trim();
            if (!text) return;
            appendMessageElement(text, "user");
            inputField.value = "";

            let loadingPlaceholder = appendMessageElement(`
                <div class="gemini-loading-wrapper">
                    <div class="fluid-loader-bar"></div>
                    <div class="fluid-loader-bar short"></div>
                    <div class="fluid-loader-bar mini"></div>
                </div>
            `, "bot");

            setTimeout(() => {
                let isScam = text.toLowerCase().includes("otp") || text.toLowerCase().includes("payment");
                let responseData = {
                    prediction: isScam ? "CRITICAL RISK DETECTED" : "VERIFIED CONTEXT MATCH",
                    confidence: "100%",
                    trust: isScam ? "SCAM / PHISHING" : "SAFE",
                    reason: isScam ? [
                        "Message invokes false financial urgency regarding ₹9,999 unauthorized payment.",
                        "URL 'support-payments-security.com' is an unverified, high-risk masking domain.",
                        "Text strictly follows classic social engineering and credential-harvesting logic flows."
                    ] : [
                        "Linguistic models confirm structural alignment with verified baseline institutional systems.",
                        "Cross-reference matrix execution detects healthy localized information signatures."
                    ]
                };
                renderResponse(responseData, loadingPlaceholder);
            }, 3000);
        }

        function renderResponse(data, container) {
            let isTrusted = data.trust === "SAFE";
            let accentClass = isTrusted ? "passed-accent" : "failed-accent";
            let tagClass = isTrusted ? "passed" : "failed";
            let builtListItems = data.reason.map(line => `<li>${line}</li>`).join("");
            
            container.innerHTML = `
                <div class="audit-card">
                    <div class="card-accent-line ${accentClass}"></div>
                    <div class="audit-title">
                        <span>${data.prediction}</span>
                        <span class="verdict-tag ${tagClass}">${data.trust}</span>
                    </div>
                    <div style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">
                        Model confidence matrix: <strong>${data.confidence}</strong>
                    </div>
                    <ul class="critique-list">${builtListItems}</ul>
                </div>
            `;
            speak(`Evaluation complete. System marks this content as ${data.trust}.`);
        }

        function toggleMapModal() {
            let el = document.getElementById("mapOverlay");
            let isVisible = el.style.display === "flex";
            el.style.display = isVisible ? "none" : "flex";
            if (!isVisible) setTimeout(renderThreatMatrixMap, 250);
        }

        function renderThreatMatrixMap() {
            if (leafletMapInstance) {
                leafletMapInstance.remove();
                leafletMapInstance = null;
            }
            leafletMapInstance = L.map('mapContainer').setView([20.0, 10.0], 2);
            let mapStyle = document.documentElement.getAttribute('data-theme') === 'dark' 
                ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
                : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            L.tileLayer(mapStyle, {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
            }).addTo(leafletMapInstance);

            const globalIncidents = [
                { coords: [37.0902, -95.7129], country: "United States", type: "Deepfake Extortion", color: "#f04438" },
                { coords: [55.3781, -3.4360], country: "United Kingdom", type: "Banking Trojan Spread", color: "#ffb703" },
                { coords: [36.2048, 138.2529], country: "Japan", type: "Voice Cloning Fraud", color: "#f04438" },
                { coords: [61.5240, 105.3188], country: "Russia", type: "State-Sponsored Disinfo", color: "#f04438" },
                { coords: [-25.2744, 133.7751], country: "Australia", type: "Delivery Phishing Array", color: "#ffb703" },
                { coords: [20.5937, 78.9629], country: "India", type: "WhatsApp Scam Ring", color: "#f04438" },
                { coords: [51.1657, 10.4515], country: "Germany", type: "Corporate Spear-Phishing", color: "#ffb703" },
                { coords: [-14.2350, -51.9253], country: "Brazil", type: "PIX Fraud Network", color: "#f04438" },
                { coords: [56.1304, -106.3468], country: "Canada", type: "Tax Authority Spoofing", color: "#ffb703" },
                { coords: [46.2276, 2.2137], country: "France", type: "Fake News Propagation", color: "#f04438" },
                { coords: [-30.5595, 22.9375], country: "South Africa", type: "Crypto Investment Scam", color: "#ffb703" },
                { coords: [9.0820, 8.6753], country: "Nigeria", type: "Advanced Fee Fraud", color: "#f04438" },
                { coords: [26.8206, 30.8025], country: "Egypt", type: "Social Media Phishing", color: "#ffb703" },
                { coords: [35.8617, 104.1954], country: "China", type: "Supply Chain Compromise", color: "#f04438" },
                { coords: [35.9078, 127.7669], country: "South Korea", type: "Messenger Phishing", color: "#ffb703" },
                { coords: [41.8719, 12.5674], country: "Italy", type: "E-commerce Fraud", color: "#f04438" },
                { coords: [15.8700, 100.9925], country: "Thailand", type: "Romance Scam Hub", color: "#ffb703" },
                { coords: [19.4326, -99.1332], country: "Mexico", type: "Ransomware Distribution", color: "#f04438" },
                { coords: [38.9637, 35.2433], country: "Turkey", type: "Political Disinformation", color: "#ffb703" },
                { coords: [-38.4161, -63.6167], country: "Argentina", type: "Bank Credential Harvesting", color: "#f04438" },
                { coords: [48.3794, 31.1656], country: "Ukraine", type: "Wiper Malware Alert", color: "#f04438" },
                { coords: [23.6978, 45.0792], country: "Saudi Arabia", type: "VIP Spoofing Campaign", color: "#ffb703" },
                { coords: [60.1282, 18.6435], country: "Sweden", type: "Healthcare Data Breach", color: "#f04438" },
                { coords: [4.2105, 101.9758], country: "Malaysia", type: "Investment Fraud", color: "#ffb703" },
                { coords: [1.3521, 103.8198], country: "Singapore", type: "Job Scam Syndicates", color: "#f04438" },
                { coords: [31.0461, 34.8516], country: "Israel", type: "Cyber Espionage Activity", color: "#f04438" },
                { coords: [-40.9006, 174.8860], country: "New Zealand", type: "Utility Bill Scam", color: "#ffb703" },
                { coords: [4.5709, -74.2973], country: "Colombia", type: "Micro-lending Extortion", color: "#f04438" },
                { coords: [60.4720, 8.4689], country: "Norway", type: "Maritime Phishing", color: "#ffb703" },
                { coords: [23.6978, 120.9605], country: "Taiwan", type: "Semiconductor IP Theft", color: "#f04438" }
            ];

            globalIncidents.forEach(node => {
                let markerCircle = L.circleMarker(node.coords, {
                    radius: 7, fillColor: node.color, color: "#fff",
                    weight: 1, opacity: 0.8, fillOpacity: 0.9
                }).addTo(leafletMapInstance);

                let labelMarkup = `
                    <div style="width:200px;">
                        <h4 style="color:${node.color}; margin-bottom:4px;">${node.country}</h4>
                        <strong style="font-size:11px; text-transform:uppercase;">⚠️ ${node.type}</strong>
                        <p style="font-size:12px; margin-top:6px; color:var(--text-muted)">Live tracking module triggered via decentralized sensor network.</p>
                    </div>
                `;
                markerCircle.bindPopup(labelMarkup, { className: 'custom-threat-popup' });
            });
            setTimeout(() => { leafletMapInstance.invalidateSize(); }, 200);
        }
    </script>
</body>
</html>
