<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Verification</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE STRUCTURE ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Inter;
}

body {
    height: 100vh;
    overflow: hidden;
}

/* MAIN WRAPPER */
.container {
    display: flex;
    height: 100vh;
    width: 100%;
}

/* SIDEBAR (kept minimal for consistency) */
.sidebar {
    width: 240px;
    background: #f7f7f7;
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    padding: 10px;
}

/* MAIN AREA */
.main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
}

/* ================= OTP CARD ================= */
.card{
    width:360px;
    padding:28px;
    border-radius:16px;
    border:1px solid #e5e7eb;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    background:#fff;
}

h2{
    margin-bottom:10px;
}

/* TIMER */
#timer{
    font-size:13px;
    margin-bottom:10px;
    color:#666;
}

/* OTP INPUT */
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    text-align:center;
    font-size:18px;
    letter-spacing:5px;
    border-radius:10px;
    border:1px solid #e5e7eb;
    outline:none;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:#000;
    color:#fff;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.02);
    opacity:0.9;
}

#msg{
    margin-top:10px;
    font-size:13px;
}

/* ================= MOBILE RESPONSIVE ================= */
@media (max-width: 768px) {

    .container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
    }

    .main {
        height: 100%;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- SIDEBAR (placeholder for consistency) -->
    <div class="sidebar">
        <p style="font-size:12px;">VERIDION AI</p>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="card">

            <h2>OTP VERIFICATION</h2>

            <div id="timer">OTP expires in 05:00</div>

            <input id="otp" placeholder="Enter OTP">

            <button onclick="verify()">Verify OTP</button>

            <div id="msg"></div>

        </div>

    </div>

</div>

<script>

let timeLeft = 300; // 5 minutes
let otpExpired = false;

/* TIMER */
function startTimer(){
    let timer = document.getElementById("timer");

    let interval = setInterval(()=>{

        if(timeLeft <= 0){
            clearInterval(interval);
            otpExpired = true;

            timer.innerText = "OTP expired. Please request new OTP.";
            timer.style.color = "red";

            document.getElementById("msg").innerText =
                "OTP expired. Redirecting...";

            setTimeout(()=>{
                window.location.href = "/";
            }, 2000);

            return;
        }

        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;

        timer.innerText =
        `OTP expires in ${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

        timeLeft--;

    }, 1000);
}

startTimer();

/* VERIFY OTP */
async function verify(){

    let email = localStorage.getItem("veridion_email");
    let otp = document.getElementById("otp").value.trim();

    if(otpExpired){
        document.getElementById("msg").innerText = "OTP expired. Request new one.";
        document.getElementById("msg").style.color = "red";
        return;
    }

    if(!email){
        document.getElementById("msg").innerText = "Session expired.";
        document.getElementById("msg").style.color = "red";

        setTimeout(()=>{
            window.location.href = "/";
        }, 1500);

        return;
    }

    if(!otp){
        document.getElementById("msg").innerText = "Enter OTP";
        document.getElementById("msg").style.color = "red";
        return;
    }

    let res = await fetch("/verify-otp", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ email, otp })
    });

    let data = await res.json();

    if(data.success){

        document.getElementById("msg").innerText = "Verified successfully...";
        document.getElementById("msg").style.color = "green";

        setTimeout(()=>{
            window.location.href = "/chat";
        }, 800);

    } else {
        document.getElementById("msg").innerText = "Invalid OTP";
        document.getElementById("msg").style.color = "red";
    }
}

</script>

</body>
</html>
