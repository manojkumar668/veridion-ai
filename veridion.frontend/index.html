<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veridion AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}

body{
    display:flex;height:100vh;
    background:#0f1115;color:#fff;
    transition:0.4s ease;
}
body.light{background:#fff;color:#111}

.sidebar{width:220px;background:#151821;padding:10px;transition:.3s}
body.light .sidebar{background:#f4f4f4}
.sidebar.hidden{width:0;overflow:hidden}

.history-item{
    padding:8px;border-radius:8px;font-size:12px;
    cursor:pointer;margin-bottom:5px;
    transition:.2s;
}
.history-item:hover{
    background:rgba(255,255,255,0.1);
    transform:scale(1.05);
}

.main{flex:1;display:flex;flex-direction:column}

.header{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 16px;
    border-bottom:1px solid rgba(255,255,255,0.05)
}

.title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:600;
    background:linear-gradient(90deg,#6366f1,#8b5cf6,#22c55e);
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.header-btn{
    padding:6px 10px;border-radius:8px;
    cursor:pointer;background:#222;color:#fff;
}

.chat{
    flex:1;padding:10px;overflow-y:auto;
    display:flex;flex-direction:column
}

.msg{
    max-width:65%;padding:8px 10px;border-radius:10px;
    margin-bottom:6px;font-size:13px;
}

.user{align-self:flex-end;background:#2b2f3a}
.bot{align-self:flex-start;background:#1a1d26}

.result-card{
    padding:10px;border-radius:12px;border:1px solid #444;
    margin-bottom:8px;
}

.input-area{
    display:flex;align-items:center;
    padding:10px;gap:8px;background:#151821
}

.input-box{
    flex:1;background:#1f222b;border-radius:25px;padding:8px 12px
}

.input-box input{
    width:100%;border:none;outline:none;background:transparent;color:inherit
}

.send,.mic,.plus{
    width:36px;height:36px;border-radius:50%;
    display:flex;justify-content:center;align-items:center;
    background:#222;color:white;cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
    <div class="history-item">History</div>
    <div id="historyList"></div>
</div>

<div class="main">

<div class="header">
    <div class="header-btn" onclick="toggleSidebar()">☰</div>
    <div class="title">Veridion AI</div>
    <div class="header-btn" onclick="toggleTheme()">🌓</div>
</div>

<div class="chat" id="chatBox"></div>

<div class="input-area">
    <div class="plus" onclick="openUpload()">+</div>

    <div class="input-box">
        <input id="input" placeholder="Ask Veridion AI..." />
    </div>

    <div class="mic" onclick="startVoice()">🎤</div>
    <div class="send" onclick="send()">➤</div>

    <input type="file" id="fileInput" style="display:none" />
</div>

</div>

<script>

const API_URL = "https://veridion-ai-8.onrender.com/predict";

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("input");
const historyList = document.getElementById("historyList");
const sidebar = document.getElementById("sidebar");

let historyData = [];

/* MESSAGE */
function addMsg(text,type){
let div=document.createElement("div");
div.className="msg "+type;
div.innerText=text;
chatBox.appendChild(div);
chatBox.scrollTop=chatBox.scrollHeight;
return div;
}

/* RESULT */
function createResultCard(data,text){

let label = data.prediction || "Unknown";
let confidence = data.confidence || 0;
let reply = data.reply || "";

let reason = label.includes("FAKE")
? "🚨 Suspicious / scam pattern detected"
: "✅ Safe content";

let card=document.createElement("div");
card.className="result-card";

card.innerHTML=`
<b>${label}</b> (${confidence}%)
<br><br>
${reply}
<br><br>
Reason: ${reason}
`;

chatBox.appendChild(card);

/* HISTORY */
let item={q:text,res:card.innerHTML};
historyData.push(item);

let h=document.createElement("div");
h.className="history-item";
h.innerText=text.substring(0,25)+"...";

h.onclick=()=>{
chatBox.innerHTML="";
addMsg(item.q,"user");
let d=document.createElement("div");
d.className="result-card";
d.innerHTML=item.res;
chatBox.appendChild(d);
};

historyList.appendChild(h);
}

/* 🚀 FINAL SEND FUNCTION */
async function send(){
let text = input.value.trim();
if(!text) return;

addMsg(text,"user");
input.value="";

let bot = addMsg("Connecting to server...","bot");

try{
    let res = await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text})
    });

    let data = await res.json();

    console.log("API RESPONSE:", data);

    bot.remove();
    createResultCard(data, text);

}catch(err){
    console.log("ERROR:", err);
    bot.innerText = "Server waking up... please wait ⏳";
}
}

/* ENTER */
input.addEventListener("keydown",e=>{
if(e.key==="Enter") send();
});

/* THEME */
function toggleTheme(){
document.body.classList.toggle("light");
}

/* SIDEBAR */
function toggleSidebar(){
sidebar.classList.toggle("hidden");
}

/* VOICE */
function startVoice(){
if(!('webkitSpeechRecognition' in window)){
alert("Not supported");
return;
}

let rec=new webkitSpeechRecognition();
rec.start();

rec.onresult=(e)=>{
input.value=e.results[0][0].transcript;
};
}

/* UPLOAD */
function openUpload(){
let c=prompt("1=File\n2=Link");
if(c=="1") document.getElementById("fileInput").click();
else if(c=="2"){
let l=prompt("Paste link:");
if(l) input.value=l;
}
}

</script>

</body>
</html>
