<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Verification - Veridion AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Inter;
    background: #f7f8fc;
    overflow: hidden;
}

/* soft glow background */
body::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(79,70,229,0.12), transparent 70%);
    top: -120px;
    left: -120px;
    filter: blur(60px);
}

/* ================= CARD ================= */
.card {
    width: 340px;
    padding: 30px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    animation: pop 0.5s ease;
    z-index: 1;
}

/* pop animation */
@keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* TITLE */
h2 {
    text-align: center;
    margin-bottom: 5px;
    font-weight: 600;
}

/* SUBTEXT */
p {
    text-align: center;
    font-size: 12px;
    color: #666;
    margin-bottom: 20px;
}

/* OTP INPUT */
input {
    width: 100%;
    padding: 14px;
    text-align: center;
    font-size: 18px;
    letter-spacing: 6px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 12px rgba(79,70,229,0.2);
}

/* BUTTON */
button {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #4f46e5;
    color: white;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(79,70,229,0.2);
}

button:active {
    transform: scale(0.97);
}

/* LOADER */
.loader {
    display: none;
    margin: 10px auto;
    width: 22px;
    height: 22px;
    border: 3px solid #eee;
    border-top: 3px solid #4f46e5;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

/* RESEND */
.small {
    text-align: center;
    margin-top: 12px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
    transition: 0.2s;
}

.small:hover {
    color: #4f46e5;
}

</style>
</head>

<body>

<div class="card">

    <h2>Verify OTP</h2>
    <p>Enter the 6-digit code sent to your email</p>

    <input id="otp" maxlength="6" placeholder="------">

    <button id="btn" onclick="verifyOTP()">Verify</button>

    <div class="loader" id="loader"></div>

    <div class="small" onclick="resendOTP()">Resend OTP</div>

</div>

<script>

/* ================= VERIFY OTP (FINAL FIXED) ================= */
function verifyOTP(){

    let otp = document.getElementById("otp").value;

    if(!otp){
        alert("Enter OTP");
        return;
    }

    // UI loading
    document.getElementById("loader").style.display = "block";
    document.getElementById("btn").innerText = "Verifying...";

    fetch("/verify-otp", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({otp: otp})
    })
    .then(res => res.json())
    .then(data => {

        console.log("🔍 OTP RESPONSE:", data); // ✅ DEBUG

        if(data.status === "success"){
            window.location.href = "/chat";
        } else {
            alert(data.msg || "Invalid OTP");

            document.getElementById("loader").style.display = "none";
            document.getElementById("btn").innerText = "Verify";
        }

    })
    .catch(err => {
        console.log("❌ ERROR:", err);

        alert("Server error");

        document.getElementById("loader").style.display = "none";
        document.getElementById("btn").innerText = "Verify";
    });
}


/* ================= RESEND OTP ================= */
function resendOTP(){

    fetch("/send-otp", {
        method: "POST",
        headers: {"Content-Type":"application/json"}
    })
    .then(res => res.json())
    .then(data => {
        console.log("🔁 RESEND:", data);
        alert("OTP resent successfully");
    })
    .catch(() => alert("Error sending OTP"));
}

</script>

</body>
</html>
